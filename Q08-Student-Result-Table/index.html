<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Class Results</h2>
        <table id="resultTable" class="result-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Marks</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Aarav</td>
                    <td class="marks">78</td>
                    <td class="result"></td>
                </tr>
                <tr>
                    <td>Diya</td>
                    <td class="marks">9</td>
                    <td class="result"></td>
                </tr>
                <tr>
                    <td>Kabir</td>
                    <td class="marks">100</td>
                    <td class="result"></td>
                </tr>
                <tr>
                    <td>Meera</td>
                    <td class="marks">35</td>
                    <td class="result"></td>
                </tr>
                <!-- TODO: Add a row for Rohan with 40 marks -->
            </tbody>
        </table>
        <button id="checkBtn" class="check-btn">Check Results</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
