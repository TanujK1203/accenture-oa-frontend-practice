<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front End Simulator</title>
<style>
  :root {
    --top: #1c2a38; --side: #16212c; --side-hover: #213040; --side-active: #2b3f53;
    --side-text: #cdd6df; --muted: #8796a5; --line: #e3e8ee;
    --editor-bg: #0f1a24; --editor-text: #e4ebf2;
    --ink: #1f2933; --soft: #52606d;
    --green: #2ea44f; --amber: #f2b632; --dark: #2e3d4d; --blue: #2f6fd6;
    --pass: #1f8f4e; --fail: #c62f3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #ffffff; display: flex; flex-direction: column; }

  .topbar { background: var(--top); color: #fff; display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
  .brand { font-size: 18px; font-weight: 300; }
  .brand b { font-weight: 700; }
  .pill { background: #2c3e50; border: 1px solid #3d5266; border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .act { border: 0; border-radius: 6px; padding: 9px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .act-dark { background: var(--dark); color: #fff; }
  .act-amber { background: var(--amber); color: #1f2933; }
  .act-green { background: var(--green); color: #fff; }
  .act-blue { background: var(--blue); color: #fff; }
  .act:hover { filter: brightness(1.1); }

  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(280px, 1fr) minmax(420px, 1.3fr); }
  .sidebar { background: var(--side); color: var(--side-text); overflow-y: auto; padding-bottom: 20px; }
  .side-head { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 16px 14px 8px; }
  .side-item { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-left: 3px solid transparent; color: inherit; text-align: left; padding: 9px 12px; font-size: 13px; cursor: pointer; }
  .side-item:hover { background: var(--side-hover); }
  .side-item.active { background: var(--side-active); border-left-color: var(--amber); color: #fff; }
  .qid { background: #243446; border-radius: 4px; padding: 2px 6px; font-size: 11px; color: #9fb0c1; flex-shrink: 0; }
  .score { margin-left: auto; font-size: 11px; font-weight: 700; }
  .score.full { color: #5fd38d; }
  .score.part { color: var(--amber); }

  .question { overflow-y: auto; padding: 20px 24px 40px; border-right: 1px solid var(--line); }
  .tag { display: inline-block; background: #e8f0fe; color: #2b5fb4; font-size: 12px; border-radius: 12px; padding: 3px 10px; }
  .tag.pyq { background: #fff4d6; color: #8a5a00; }
  .question h2 { font-size: 22px; margin: 12px 0 4px; }
  .question h3 { font-size: 16px; margin: 20px 0 8px; }
  .question p, .question li { color: var(--soft); line-height: 1.55; font-size: 14.5px; }
  .question ul { padding-left: 20px; margin: 0; }
  .question code { background: #f1f3f5; color: #c7254e; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .question pre { background: #f6f8fa; border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 12.5px; }
  .note { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 12px; font-size: 12.5px !important; color: var(--muted) !important; }

  .panel { margin-top: 22px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
  .panel h3 { margin-top: 4px; }
  .result-row { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid #f0f2f4; font-size: 14px; }
  .result-row:first-of-type { border-top: 0; }
  .mark { font-weight: 700; width: 18px; flex-shrink: 0; }
  .mark.ok { color: var(--pass); }
  .mark.no { color: var(--fail); }
  .why { display: block; color: var(--fail); font-size: 12.5px; margin-top: 2px; }

  .workbench { display: flex; flex-direction: column; min-height: 0; background: #f7f9fb; }
  .tabs { display: flex; gap: 2px; background: #ffffff; border-bottom: 1px solid var(--line); padding: 0 8px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 600; font-size: 13px; color: var(--soft); cursor: pointer; }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .editor { flex: 1.2; min-height: 0; resize: none; border: 0; outline: none; background: var(--editor-bg); color: var(--editor-text);
            font: 13.5px/1.55 Menlo, Consolas, "Courier New", monospace; padding: 14px; tab-size: 4; white-space: pre; }
  .result-bar { display: flex; gap: 12px; align-items: center; font-weight: 700; font-size: 13px; padding: 8px 12px; background: #ffffff; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .console-msg { font-weight: 500; color: var(--fail); font-family: Menlo, Consolas, monospace; font-size: 12px; }
  .result { flex: 1; min-height: 0; border: 0; background: #ffffff; width: 100%; }
  .test-frame { position: fixed; left: -5000px; top: 0; width: 1024px; height: 768px; border: 0; visibility: hidden; }

  @media (max-width: 1000px) {
    html, body { height: auto; }
    .layout { flex: none; grid-template-columns: 1fr; }
    .sidebar { max-height: 240px; }
    .question { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
    .workbench { height: 900px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><b>Mercer-style</b> Front End Simulator</div>
  <span class="pill">Accenture OA Practice</span>
  <div class="actions">
    <button id="resetBtn" class="act act-dark">Reset Boilerplate</button>
    <button id="solutionBtn" class="act act-amber">Show Solution</button>
    <button id="runBtn" class="act act-green" title="Ctrl/Cmd + Enter">&#9654; Run Code</button>
    <button id="testBtn" class="act act-blue">&#10003; Run Tests</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="question" id="question"></main>
  <section class="workbench">
    <div class="tabs">
      <button class="tab active" data-file="html">HTML</button>
      <button class="tab" data-file="css">CSS</button>
      <button class="tab" data-file="js">JavaScript</button>
    </div>
    <textarea id="editor" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="result-bar">Result <span id="consoleMsg" class="console-msg"></span></div>
    <iframe id="result" class="result" title="Result"></iframe>
  </section>
</div>
<script src="_engine/questions.js"></script>
<script src="_engine/simulator.js"></script>
</body>
</html>
