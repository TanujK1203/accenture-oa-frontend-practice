<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery">
        <img id="mainImage" class="main-image" src="https://picsum.photos/id/10/480/300" alt="Photo 1">
        <p id="caption" class="caption">Photo 1</p>

        <div class="thumbnails">
            <img class="thumb active" src="https://picsum.photos/id/10/480/300" alt="Photo 1">
            <img class="thumb" src="https://picsum.photos/id/20/480/300" alt="Photo 2">
            <img class="thumb" src="https://picsum.photos/id/30/480/300" alt="Photo 3">
            <img class="thumb" src="https://picsum.photos/id/40/480/300" alt="Photo 4">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
