<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="reader">
        <div class="toolbar">
            <button id="decreaseBtn" class="size-btn">A-</button>
            <span id="sizeLabel" class="size-label">16px</span>
            <button id="increaseBtn" class="size-btn">A+</button>
            <!-- TODO: Add the Reset button -->
        </div>
        <p id="article" class="article">Practice beats reading. When you type the code yourself, you notice the small details: the missing unit, the wrong id, the string that should have been a number. Those details are exactly what the online assessment checks, one objective at a time.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
